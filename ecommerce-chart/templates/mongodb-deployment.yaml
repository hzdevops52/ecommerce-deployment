apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    matchLabels:
      app: mongodb

  serviceName: mongodb-service

  replicas: {{ .Values.mongodb.replicaCount}}

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image.repository}}:{{ .Values.mongodb.image.tag}}

          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongodb
              mountPath: /data/db

      volumes:
        - name: mongodb
          persistentVolumeClaim:
            claimName: mongodb-pvc
