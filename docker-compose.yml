services:
  frontend:
    image: ghcr.io/hzdevops52/e-frontend:test
    ports:
      - "3001:80"
    restart: unless-stopped

  backend:
    image: ghcr.io/hzdevops52/e-backend:test
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    volumes:
      - mongo_test_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_test_data:
    external: true